spring.application.name=dealflow

spring.datasource.url=jdbc:postgresql://localhost:5435/dealflow
spring.datasource.username=dealflow
spring.datasource.password=dealflow

# Flyway owns the schema. Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=public

server.port=8080
